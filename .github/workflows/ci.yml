# Vérifie ce que `npm run test:all` vérifie en local, sur une machine qui n'a
# rien d'installé. C'est le seul garde-fou entre une régression et deux
# téléphones qui ne génèrent plus rien un dimanche matin : un APK installé parle
# aux mêmes Cloud Functions de production, et un déploiement cassé les casse
# dans la seconde.
#
# Aucun secret n'est requis, et c'est délibéré : le dépôt est public. Le
# déploiement et `gemini:probe` restent des gestes manuels.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deux poussées rapprochées n'occupent pas deux runners pour un résultat qu'on
# ne lira pas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typage, lint et les trois suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # L'émulateur Firestore tourne sur la JVM. Sans JRE il ne démarre pas, et
      # son message d'erreur ne le dit pas clairement — c'est ce qui nous avait
      # bloqués en local.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Le JAR de l'émulateur pèse plusieurs dizaines de Mo et se
      # retéléchargerait à chaque exécution.
      - name: Cache des émulateurs Firebase
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - run: npm ci

      # `app/.expo/types/router.d.ts` est généré et gitignoré : un clone frais ne
      # l'a pas. Sans lui, `router.push('/route-inexistante')` compile sans
      # broncher — vérifié — et la CI serait moins stricte que la machine
      # locale. Seul `expo start` le produit ; il n'existe pas de sous-commande
      # de génération. On le démarre donc le temps qu'il écrive le fichier.
      - name: Générer les types de routes Expo
        working-directory: app
        run: |
          npx expo start --port 8099 > /tmp/expo-typegen.log 2>&1 &
          for _ in $(seq 1 90); do
            [ -f .expo/types/router.d.ts ] && break
            sleep 1
          done
          pkill -f 'expo start --port 8099' || true
          if [ ! -f .expo/types/router.d.ts ]; then
            echo "::error::Types de routes non générés — le typage des routes ne serait pas vérifié."
            tail -30 /tmp/expo-typegen.log
            exit 1
          fi

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:all

      # Le seuil de couverture est une garantie, pas une statistique : les
      # schémas gardent les frontières du système, et Vitest 4 ne les affiche
      # plus quand ils sont complets. La commande échoue s'ils redescendent.
      - run: npm run test:coverage

      # Code mort : fichiers, exports et dépendances que plus personne
      # n'utilise. C'est ce qu'on cherchait à la main à chaque audit, et ce que
      # ni le typage ni le lint ne voient — une dépendance inutilisée compile
      # parfaitement, et part quand même dans l'APK.
      - run: npm run knip

      # La matrice de versions d'Expo est dictée par le SDK, pas par le semver
      # npm : c'est ici qu'on surveille sa dérive, et pas dans Renovate, qui
      # proposerait des montées qu'Expo ne supporte pas.
      #
      # Une montante Expo ne doit pas rendre la CI rouge. Mais un simple
      # `continue-on-error` afficherait le pas comme réussi et enterrerait
      # l'alerte dans les logs — or c'est précisément l'alerte qu'on veut. On
      # émet donc une annotation, visible sur la page du run.
      - name: Dérive de la matrice Expo
        working-directory: app
        run: |
          if npx expo install --check > /tmp/expo-check.log 2>&1; then
            echo "Matrice Expo alignée."
          else
            cat /tmp/expo-check.log
            paquets=$(grep -oE '^ +[^ ]+ - expected version: [^ ]+' /tmp/expo-check.log \
              | sed 's/^ *//' | paste -sd ';' - | sed 's/;/; /g')
            echo "::warning title=Matrice Expo en retard::${paquets:-voir les logs} — réaligner avec: cd app && npx expo install --fix"
          fi
